# Versioned prompt templates. An entry is frozen once any run has used it: never edit a frozen
# template or its hash. To change a prompt, add a new file (e.g. p2_reader_v2.txt) and a new entry here.
# The harness refuses to run a template whose file hash differs from the hash recorded here.
#
# The text sent to a model is the file content with trailing newlines removed. The templates have
# no slots: the manuscript is attached before the prompt, never pasted into it.

review:
  p1_bare_v1:
    file: review/p1_bare_v1.txt
    sha256: "4240cb08034879d138ba537b4229e7a58cc99bebbdf4d4bc4cc9fe25abebf95f"
    rung: Prompt 1 (Bare)
    added: 2026-10-15
  p2_reader_v1:
    file: review/p2_reader_v1.txt
    sha256: "e69be9cc2400b721596f1da473fb578f8005e615b85ce30aa94b3b508081160a"
    rung: Prompt 2 (Reader instructions)
    added: 2026-10-15
  p3_criteria_v1:
    file: review/p3_criteria_v1.txt
    sha256: "ddaa589f558f18f36f767f40aeeece56c1b3cb8b82004888bb803f2ddde0c8e6"
    rung: Prompt 3 (Reader instructions plus Organization Science criteria)
    added: 2026-10-15

# Coding templates have two slots: {CODING_SHEET} (the frozen coding sheet, read from a local path outside this
