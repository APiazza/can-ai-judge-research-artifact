# Judge templates (exploratory judge analysis, plan of 24 Oct 2026). The system template is King and Worthington
# (2026), Supplementary Appendix D(b), "Overall pairwise ranking (reviews only)", with their abbreviated Appendix B
# guidelines inserted where they mark it: the opening paragraph and the thirteen-item checklist, closing with "Please
# ensure your review focuses on the current research without recommending additional work" (their description of the
# block in Appendix D). Characters as printed (curly quotes, em dash); paragraphs joined across the PDF's line breaks;
# every paragraph and item checked against the PDF text (sha256 9643875e… of peerless-supp.pdf). The user template holds
# the two reviews in the tags their prompt names.
judge:
