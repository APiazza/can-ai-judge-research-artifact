<text x="83" y="391" font-size="18">Does the analysis test the difference it</text>
<text x="83" y="413" font-size="18">claims?</text>
<line x1="977.625" y1="393" x2="984.75" y2="393" stroke="#205f86" stroke-width="4"/>
<circle cx="977.625" cy="393" r="5" fill="#205f86"/>
<circle cx="984.75" cy="393" r="5" fill="#205f86"/>
<line x1="505.0" y1="415" x2="507.375" y2="415" stroke="#b34d17" stroke-width="4"/>
