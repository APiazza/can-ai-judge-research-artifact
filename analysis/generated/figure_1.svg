<text x="83" y="519" font-size="18">Do more opportunities mean better</text>
<text x="83" y="541" font-size="18">selection?</text>
<line x1="837.5" y1="521" x2="873.125" y2="521" stroke="#205f86" stroke-width="4"/>
<circle cx="837.5" cy="521" r="5" fill="#205f86"/>
<circle cx="873.125" cy="521" r="5" fill="#205f86"/>
<line x1="505.0" y1="543" x2="505.0" y2="543" stroke="#b34d17" stroke-width="4"/>
<rect x="500.0" y="538" width="10" height="10" fill="#b34d17"/>
<rect x="500.0" y="538" width="10" height="10" fill="#b34d17"/>
<line x1="618" y1="25" x2="644" y2="25" stroke="#205f86" stroke-width="4"/>
<circle cx="631" cy="25" r="5" fill="#205f86"/>
<text x="650" y="31" font-size="19">Planted problems</text>
<line x1="868" y1="25" x2="894" y2="25" stroke="#b34d17" stroke-width="4"/>
<rect x="876" y="20" width="10" height="10" fill="#b34d17"/>
<text x="900" y="31" font-size="19">Baseline</text>
<text x="790.0" y="627" text-anchor="middle" font-size="17">Reviews raising the concern with the specified reasoning (%)</text>
<text x="15" y="654" font-size="14">† Neither scorer passed the original check; ‡ only one passed. Both scorers contribute to every range.</text>
<text x="15" y="678" font-size="14">Ranges show coder disagreement. Criticisms of the baseline version may be defensible.</text>
</g></svg>